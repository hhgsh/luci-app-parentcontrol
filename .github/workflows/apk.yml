name: Build OpenWrt 25.12 APK Package

on:
  push:
    tags:
      - 'v*' # 当推送以 v 开头的 tag（如 v1.0.0）时自动触发并发布 Release
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag 名称'
        required: false
        default: 'v1.0.0'

jobs:
  build:
    name: Build APK for OpenWrt 25.12
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build packages with OpenWrt SDK
        uses: sbwml/openwrt-gh-action-sdk@main
        env:
          ARCH: x86_64-25.12
          PACKAGES: luci-app-parentcontrol
          NO_EXTRA_FEEDS: '1'

      - name: Organize Artifacts
        id: organize
        run: |
          mkdir -p ./release
          find bin/packages/ -type f -name "*.apk" -exec cp {} ./release/ \;
          echo "APK_COUNT=$(ls -1 ./release/*.apk 2>/dev/null | wc -l)" >> $GITHUB_ENV

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: env.APK_COUNT != '0'
        with:
          name: openwrt-25.12-apk-packages
          path: ./release/*.apk

      # 新增：上传打包产物至 GitHub Releases
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: env.APK_COUNT != '0'
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: Release ${{ github.event.inputs.release_tag || github.ref_name }}
          draft: false
          prerelease: false
          files: ./release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
