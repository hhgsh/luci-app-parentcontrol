name: Build OpenWrt 25.12 APK Package

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build APK for OpenWrt 25.12
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build packages with OpenWrt SDK
        uses: sbwml/openwrt-gh-action-sdk@main
        env:
          # 指定支持 25.12 及 apk 格式的目标架构和版本
          ARCH: x86_64-25.12
          # 指定要编译的包名（对应 Makefile 中的 PKG_NAME）
          PACKAGES: luci-app-parentcontrol
          # 不加载默认的额外 feeds（根据需求填 0 或 1）
          NO_EXTRA_FEEDS: '1'

      - name: Organize Artifacts
        id: organize
        run: |
          mkdir -p ./release
          # 查找 SDK 编译出的所有 .apk 文件并移动至 release 目录
          find bin/packages/ -type f -name "*.apk" -exec cp {} ./release/ \;
          echo "APK_COUNT=$(ls -1 ./release/*.apk 2>/dev/null | wc -l)" >> $GITHUB_ENV

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: env.APK_COUNT != '0'
        with:
          name: openwrt-25.12-apk-packages
          path: ./release/*.apk
