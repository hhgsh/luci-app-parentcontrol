name: Build Parentcontrol 25.12 APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          path: 'luci-app-parentcontrol'

      - name: Install Build Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gcc-multilib g++-multilib \
            gettext git libssl-dev libncurses5-dev libncursesw5-dev python3 python3-pip rsync unzip zlib1g-dev zstd

      - name: Setup OpenWrt 25.12 SDK
        run: |
          SDK_URL=$(curl -s https://downloads.openwrt.org/snapshots/targets/x86/64/ | grep -oE 'openwrt-sdk-[^"]*\.tar\.zst' | head -n 1)
          FULL_URL="https://downloads.openwrt.org/snapshots/targets/x86/64/${SDK_URL}"
          echo "Downloading SDK from: ${FULL_URL}"
          wget "$FULL_URL" -O openwrt-sdk.tar.zst
          mkdir sdk
          tar --zstd -xf openwrt-sdk.tar.zst --strip-components=1 -C sdk
          mv luci-app-parentcontrol sdk/package/luci-app-parentcontrol

      - name: Update and Install Feeds
        working-directory: sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure Package
        working-directory: sdk
        run: |
          echo "CONFIG_ALL=n" > .config
          echo "CONFIG_PACKAGE_luci-app-parentcontrol=m" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-parentcontrol-zh-cn=m" >> .config
          make defconfig

      - name: Compile APK Package
        working-directory: sdk
        run: |
          make package/luci-app-parentcontrol/compile V=s -j$(nproc) || make package/luci-app-parentcontrol/compile V=s -j1

      - name: Organize Artifacts
        run: |
          mkdir -p output
          find sdk/bin/ -type f -name "luci-app-parentcontrol_*.apk" -exec cp {} output/ \;
          find sdk/bin/ -type f -name "luci-i18n-parentcontrol-zh-cn_*.apk" -exec cp {} output/ \;
          
          echo "APK_COUNT=$(ls -1 output/*.apk 2>/dev/null | wc -l)" >> $GITHUB_ENV
          echo "=== 提取到的目标文件 ==="
          ls -la output/

      # 关键修改：生成不重复的动态 Release Tag
      - name: Generate Dynamic Tag Name
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "RELEASE_TAG=${github.ref_name}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=v25.12-$(date +'%Y%m%d-%H%M')" >> $GITHUB_ENV
          fi

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: env.APK_COUNT != '0'
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "LuCI ParentControl APK (${{ env.RELEASE_TAG }})"
          files: output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
